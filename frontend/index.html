<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Cruncher — Algorithmic Schedule Utility</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
    <h1>Exam Cruncher</h1>
    <p>Local-First Algorithmic Study Plan Generator</p>
    
    <label for="syllabus-input">Paste Raw Course Syllabus Text:</label>
    <textarea id="syllabus-input" placeholder="Paste modules, topics, or chapters here..."></textarea>
    
    <div class="control-group">
        <div>
            <label for="days-input">Total Days Available:</label>
            <input type="number" id="days-input" value="25" min="1">
        </div>
        <div>
            <label for="crunch-btn">&nbsp;</label>
            <button id="crunch-btn">Initialize & Crunch Plan</button>
        </div>
    </div>

    <div id="progress-container" class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="status-console">Console: Awaiting instruction...</div>
    
    <div id="output-area"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
