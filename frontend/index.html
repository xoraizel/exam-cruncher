<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Cruncher — Algorithmic Schedule Utility</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
    <h1>Exam Cruncher</h1>
    <p>Zero-Cost Algorithmic Study Plan Generator</p>

    <!-- Auth Section -->
    <section id="auth-section">
        <form id="auth-form" class="auth-form" style="display:flex;">
            <div class="auth-fields">
                <input type="email" id="auth-email" placeholder="Email" required autocomplete="email">
                <input type="password" id="auth-password" placeholder="Password (6+ chars)" required autocomplete="current-password">
                <span id="auth-error" class="auth-error"></span>
            </div>
            <div class="auth-buttons">
                <button type="submit" id="auth-submit-btn" class="btn-primary">Sign In</button>
                <button type="button" id="auth-toggle-btn" class="btn-link">Need an account? Sign Up</button>
            </div>
        </form>
        <div id="user-info" style="display:none;" class="user-info">
            <span id="user-email" class="user-email"></span>
            <button id="sign-out-btn" class="btn-small btn-outline">Sign Out</button>
        </div>
    </section>

    <!-- API Settings -->
    <button id="settings-toggle" class="settings-toggle-btn">API Settings</button>
    <div id="settings-panel" class="settings-panel" style="display:none;">
        <label for="groq-key-input">Groq API Key:</label>
        <input type="password" id="groq-key-input" class="key-input" placeholder="gsk_...">
        <label for="gemini-key-input">Gemini API Key:</label>
        <input type="password" id="gemini-key-input" class="key-input" placeholder="AIza...">
        <p class="settings-hint">Keys are stored locally in your browser. At least one key is required.</p>
    </div>

    <!-- Plan Input -->
    <label for="syllabus-input">Paste Raw Course Syllabus Text:</label>
    <textarea id="syllabus-input" placeholder="Paste modules, topics, or chapters here..."></textarea>

    <div class="control-group">
        <div>
            <label for="days-input">Total Days Available:</label>
            <input type="number" id="days-input" value="25" min="1">
        </div>
        <div>
            <label for="crunch-btn">&nbsp;</label>
            <button id="crunch-btn">Initialize & Crunch Plan</button>
        </div>
    </div>

    <div id="progress-container" class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="status-console">Console: Awaiting instruction...</div>

    <!-- Saved Plans History -->
    <section id="history-section" style="display:none;">
        <h2 class="section-title">Saved Plans</h2>
        <ul id="history-list" class="history-list"></ul>
    </section>

    <!-- Plan Progress Tracking -->
    <section id="plan-progress-section" style="display:none;">
        <h2 id="plan-progress-title" class="section-title">Progress</h2>
        <div id="plan-progress-list" class="progress-list"></div>
    </section>

    <div id="output-area"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
